<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Site Title</title>
    <meta name="description" content="A cozy stovetop stew with no structured data on the page." />
  </head>
  <body>
    <h1>Rustic Vegetable Stew</h1>
    <h2>Ingredients</h2>
    <ul>
      <li>2 carrots, sliced</li>
      <li>1 onion, diced</li>
      <li>400g canned tomatoes</li>
      <li>500ml vegetable stock</li>
    </ul>
    <h2>Instructions</h2>
    <ol>
      <li>Saute the onion and carrots until soft.</li>
      <li>Add the tomatoes and stock, then simmer for 25 minutes.</li>
    </ol>
  </body>
</html>
