services:
  - type: web
    name: tableset
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tableset-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: tableset-db
    plan: free
